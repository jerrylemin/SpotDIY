[package]
name = "spotdiy"
version = "0.1.0"
description = "SpotDIY local-first music player"
authors = ["SpotDIY contributors"]
edition = "2021"

[lib]
name = "spotdiy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", features = ["serde"] }
keyring = "4.2.0"
lofty = "0.25.1"
notify = "8.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "query", "rustls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
sha2 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rand = { version = "0.9", features = ["small_rng"] }
regex = "1.13.1"
strsim = "0.11.1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2"
tokio = { version = "1.53.1", features = ["process", "net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
spotdiy-windows-smtc = { path = "crates/spotdiy-windows-smtc" }

[lints.rust]
unsafe_code = "forbid"
